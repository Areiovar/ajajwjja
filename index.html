<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0b">
<meta name="color-scheme" content="dark">
<title>Расписание КВ-Б26</title>
<style>
:root{
  --bg:#0a0d0b;
  --card:#121815;
  --card2:#16201b;
  --line:#1f2b25;
  --text:#e8f1eb;
  --muted:#8fa196;
  --dim:#5b6c62;
  --g:#3ee08f;
  --g2:#1fae6a;
  --ink:#04140b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(900px 420px at 50% -120px,rgba(62,224,143,.10),transparent 70%),
    var(--bg);
  background-repeat:no-repeat;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:560px;margin:0 auto}

/* шапка */
.top{
  position:sticky;top:0;z-index:10;
  padding:max(14px,env(safe-area-inset-top)) 16px 10px;
  background:rgba(10,13,11,.88);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ttl h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.ttl p{font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--muted);transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--g),var(--g2));color:var(--ink)}
.row2{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 8px}
#monthLbl{font-size:14px;font-weight:700}
#monthLbl span{font-weight:500;color:var(--muted);margin-left:8px;font-size:12.5px}
#monthLbl span::before{content:"·";margin-right:8px;color:var(--dim)}
.todaybtn{font-size:12.5px;font-weight:700;color:var(--g);padding:5px 12px;border:1px solid rgba(62,224,143,.35);border-radius:999px;background:rgba(62,224,143,.08)}
.todaybtn[hidden]{display:none}

/* лента дат */
.strip{
  position:relative;
  display:flex;align-items:stretch;gap:6px;
  overflow-x:auto;overflow-y:hidden;
  margin:0 -16px;padding:2px 16px 4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.strip::-webkit-scrollbar{display:none}
.mdiv{flex:0 0 auto;display:flex;align-items:center;justify-content:center;min-width:30px}
.mdiv span{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--g);opacity:.75;writing-mode:vertical-rl;transform:rotate(180deg)}
.chip{
  flex:0 0 auto;width:50px;height:68px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  transition:background .2s,border-color .2s,transform .15s;
}
.chip.mon{margin-left:8px}
.chip i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase}
.chip b{font-size:19px;font-weight:750}
.chip u{width:5px;height:5px;border-radius:50%;background:transparent;text-decoration:none}
.chip.has u{background:var(--g)}
.chip.sun{opacity:.55}
.chip.sun i{color:#c97a7a}
.chip.today{border-color:rgba(62,224,143,.6)}
.chip.today b{color:var(--g)}
.chip.sel{background:linear-gradient(160deg,var(--g),var(--g2));border-color:transparent;box-shadow:0 6px 20px rgba(62,224,143,.25);transform:translateY(-1px);opacity:1}
.chip.sel i,.chip.sel b{color:var(--ink)}
.chip.sel u{background:var(--ink)}
.chip.sel.has u{background:var(--ink)}

/* день */
main{padding:18px 16px 40px;min-height:60vh}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.dayhead h2{font-size:20px;font-weight:800;letter-spacing:-.2px}
.dayhead p{font-size:13px;color:var(--muted);margin-top:3px}
.tag{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink);background:var(--g);padding:4px 9px;border-radius:999px;white-space:nowrap}

.card{
  --c:#3ee08f;--cb:rgba(62,224,143,.13);
  position:relative;overflow:hidden;
  display:flex;gap:14px;
  padding:14px 14px 14px 16px;margin-bottom:12px;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:18px;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card.prak{--c:#2dd4d4;--cb:rgba(45,212,212,.13)}
.card.lab{--c:#c6f24e;--cb:rgba(198,242,78,.13)}
.card.past{opacity:.5}
.card.now{border-color:rgba(62,224,143,.55);box-shadow:0 0 0 1px rgba(62,224,143,.15),0 10px 30px rgba(62,224,143,.10)}
.time{flex:0 0 auto;min-width:50px}
.time b{display:block;font-size:17px;font-weight:750;letter-spacing:.2px}
.time span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.body{flex:1;min-width:0}
.top2{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--c);background:var(--cb);padding:3px 9px;border-radius:999px}
.pairs{font-size:12px;color:var(--dim)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:auto}
.pill.now{background:var(--g);color:var(--ink);animation:pulse 2s infinite}
.pill.next{background:rgba(62,224,143,.12);color:var(--g)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.body h3{font-size:16px;font-weight:700;line-height:1.3;margin:9px 0 4px}
.meta{display:flex;align-items:flex-start;gap:9px;margin-top:8px;font-size:13px;color:var(--muted);line-height:1.4}
.meta svg{flex:0 0 auto;width:16px;height:16px;margin-top:1px;stroke:var(--g);opacity:.9}
.meta b{color:var(--text);font-weight:650}
.addr{color:var(--g);text-decoration:none;border-bottom:1px dotted rgba(62,224,143,.5)}

.empty{text-align:center;padding:46px 20px 20px;color:var(--muted)}
.empty svg{width:54px;height:54px;stroke:var(--g);opacity:.8;margin-bottom:14px}
.empty h3{color:var(--text);font-size:18px;font-weight:750;margin-bottom:6px}
.empty p{font-size:14px}
.gobtn{margin-top:20px;padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:650;color:var(--g);background:rgba(62,224,143,.09);border:1px solid rgba(62,224,143,.3)}

.brk{display:flex;align-items:center;justify-content:center;gap:10px;margin:-2px 0 10px;font-size:12px;color:var(--dim)}
.brk::before,.brk::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px)}
.brk span{color:var(--muted);font-weight:600}
.brk em{font-style:normal}
.foot{padding:6px 24px 36px;text-align:center;font-size:11.5px;color:var(--dim);line-height:1.6}

.fade-r{animation:inr .28s ease}
.fade-l{animation:inl .28s ease}
@keyframes inr{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="row1">
      <div class="ttl">
        <h1>Расписание</h1>
        <p>КВ-Б26 · 2 подгруппа · 1 семестр 2026/27</p>
      </div>
    </div>
    <div class="row2">
      <div id="monthLbl"></div>
      <button class="todaybtn" id="todayBtn" hidden>Сегодня</button>
    </div>
    <div class="strip" id="strip"></div>
  </div>
  <main id="view"></main>
  <div class="foot">
    Теоретическое обучение: 01.09.2026 - 21.12.2026<br>
    Сессия: 22.12.2026 - 11.01.2027
  </div>
</div>

<script>
/*CORE*/
const SLOTS=[['09:00','10:35'],['10:45','12:20'],['13:00','14:35'],['14:45','16:20'],['16:30','18:05']];
const half=i=>i<2?0:1;
const dayNum=(y,m,d)=>Math.round(Date.UTC(y,m-1,d)/864e5);
const START=dayNum(2026,9,1), END=dayNum(2026,12,21), WEEK0=dayNum(2026,9,7);

const SUBJ={
  rus:'Русский язык и культура речи',
  gos:'Основы российской государственности',
  mod:'Моделирование прикладных информационных процессов',
  lang:'Иностранный язык',
  ib:'Информационная безопасность современного общества',
  mis:'Введение в морские информационные системы',
  fiz:'Физические исследования в гидрометеорологии и экологии',
  rrs:'Введение в радионавигацию, радиолокацию и связь',
  pi:'Введение в программную инженерию',
  pkd:'Введение в проектно-конструкторскую деятельность',
  vpd:'Введение в профессиональную деятельность',
  ant:'Антенны и распространение радиоволн'
};
const TEACH={
  ore:'доц. Орехова Наталья Николаевна',
  sav:'доц. Савинов Родион Валентинович',
  bur:'проф. Бурлов Вячеслав Георгиевич',
  sin:'ст. преп. Синецкая Марина Юрьевна',
  kom:'доц. Командакова Мария Сергеевна',
  yur:'доц. Юрин Игорь Валентинович',
  gol:'ст. преп. Гольдибаев Константин Владимирович',
  kor:'доц. Коринец Екатерина Михайловна',
  lep:'проф. Лепешкин Олег Михайлович',
  vla:'доц. Власов Вячеслав Александрович',
  kud:'асс. Кудрявцева Алена Ильинична'
};
const PLACE={
  k4:{b:'Корпус 4',a:'Рижский пр., д. 11'},
  k2:{b:'Корпус 2',a:'пр. Металлистов, д. 3'},
  rem:{b:'Дистанционная поддержка',a:''}
};
const TYPE={lek:'Лекция',prak:'Практика',lab:'Лабораторная'};

/* даты вида "07.09,21.09-19.10" -> список периодов */
function rng(str){
  return str.split(',').map(x=>x.trim()).map(x=>{
    const p=x.split('-').map(y=>{const q=y.split('.').map(Number);return dayNum(2026,q[1],q[0]);});
    return [p[0],p[p.length-1]];
  });
}
const E=[];
/* d: день недели 1-6, s: номера пар (0-4), g: подгруппа (0 = обе), w: u/l = верхняя/нижняя неделя */
function add(d,s,sub,type,t,loc,room,dates,o){
  o=o||{};
  E.push({d:d,s:s,sub:sub,type:type,t:t,loc:loc,room:room,dates:rng(dates),g:o.g||0,w:o.w||null});
}

/* понедельник */
add(1,[0],'rus','lek','ore','k4','309','07.09-21.09');
add(1,[0],'gos','lek','sav','k4','309','28.09-12.10');
add(1,[0,1],'gos','prak','sav','k4','309','19.10');
add(1,[1],'gos','lek','sav','k4','309','07.09-12.10');
add(1,[0,1],'mod','lek','bur','k2','303','26.10-14.12');
add(1,[2,3],'lang','lab','sin','k4','107','21.09-19.10',{g:1});
add(1,[2,3],'lang','lab','kom','k4','103.4','07.09,21.09-19.10',{g:2});
add(1,[2],'ib','lek','yur','k2','201','26.10-21.12');
add(1,[3],'ib','prak','yur','k2','201','26.10-21.12');

/* вторник (дистанционно) */
add(2,[0],'mis','lek','gol','rem','','08.09-20.10');
add(2,[0],'fiz','lek','kor','rem','','27.10-08.12');
add(2,[1],'rrs','lek','yur','rem','','08.09-20.10');
add(2,[1],'pi','lek','lep','rem','','10.11');
add(2,[1],'fiz','lek','kor','rem','','27.10,03.11,17.11-01.12');
add(2,[2],'pkd','lek','lep','rem','','08.09-22.09,06.10-27.10');
add(2,[2],'pi','lek','lep','rem','','03.11,10.11');
add(2,[3],'pi','lek','lep','rem','','08.09-22.09,06.10-10.11');

/* среда */
add(3,[0,1],'gos','prak','sav','k2','304','09.09-28.10');
add(3,[0],'ib','lek','yur','k2','304','11.11-16.12');
add(3,[1],'ib','lek','yur','k2','304','11.11,18.11');
add(3,[1],'ib','prak','yur','k2','304','25.11-16.12');
add(3,[2,3],'vpd','lek','yur','k2','304','02.09-21.10');
add(3,[2,3],'fiz','prak','kor','k2','304','28.10,11.11-16.12');

/* четверг */
add(4,[0,1],'lang','lab','sin','k4','107','24.09-08.10',{g:1});
add(4,[0,1],'lang','lab','kom','k4','105','24.09,08.10',{g:2});
add(4,[3,4],'ant','lek','vla','k2','303','15.10-03.12');

/* пятница */
add(5,[0],'pkd','lab','lep','k2','302А','11.09-30.10',{g:1});
add(5,[0],'pi','lab','lep','k2','302А','06.11,13.11',{g:1});
add(5,[0],'rrs','lab','yur','k2','302Б','11.09-30.10',{g:2});
add(5,[0],'vpd','lab','yur','k2','302Б','06.11,13.11',{g:2});
add(5,[1],'rrs','lab','yur','k2','302Б','11.09-30.10',{g:1});
add(5,[1],'vpd','lab','yur','k2','302Б','06.11,13.11',{g:1});
add(5,[1],'pkd','lab','lep','k2','302А','11.09-30.10',{g:2});
add(5,[1],'pi','lab','lep','k2','302А','06.11,13.11',{g:2});
add(5,[2],'pi','lab','lep','k2','14','11.09-06.11',{g:1});
add(5,[2],'mod','lab','bur','k2','14','13.11-27.11',{g:1});
add(5,[2],'vpd','lab','yur','k2','302А','11.09-06.11',{g:2});
add(5,[2],'mod','lab','bur','k2','14','04.12-18.12',{g:2});
add(5,[3],'vpd','lab','yur','k2','302А','11.09-06.11',{g:1});
add(5,[3],'ant','lab','vla','k2','302А','13.11-27.11',{g:1});
add(5,[3],'pi','lab','lep','k2','14','11.09-06.11',{g:2});
add(5,[3],'ant','lab','vla','k2','302А','04.12-18.12',{g:2});

/* суббота: верхняя неделя */
add(6,[0,1],'mis','prak','gol','k2','312','12.09-24.10',{w:'u'});
add(6,[0,1],'fiz','prak','kor','k2','312','07.11-19.12',{w:'u'});
add(6,[2],'rus','prak','kud','k2','303','12.09-10.10',{w:'u'});
add(6,[2],'ant','lek','vla','k2','303','07.11',{w:'u'});
add(6,[3],'rus','prak','kud','k2','303','12.09,26.09',{w:'u'});
add(6,[3],'mod','lek','bur','k2','303','10.10',{w:'u'});
/* суббота: нижняя неделя */
add(6,[0,1],'vpd','lab','yur','k2','302А','19.09',{w:'l',g:1});
add(6,[0,1],'ant','lab','vla','k2','302А','17.10-12.12',{w:'l',g:1});
add(6,[0,1],'vpd','lab','yur','k2','302А','03.10',{w:'l',g:2});
add(6,[0,1],'mod','lab','bur','k2','101','17.10-12.12',{w:'l',g:2});
add(6,[2],'vpd','lek','yur','k2','205','19.09',{w:'l'});
add(6,[2,3],'mod','lab','bur','k2','317в','17.10-12.12',{w:'l',g:1});
add(6,[2,3],'ant','lab','vla','k2','302А','17.10-12.12',{w:'l',g:2});

function parity(day){
  const w=Math.floor((day-WEEK0)/7);
  return (((w%2)+2)%2)===0?'u':'l';
}
function weekday(day){
  const g=new Date(day*864e5).getUTCDay();
  return g===0?7:g;
}
function lessonsFor(day,g){
  const wd=weekday(day), par=parity(day);
  const out=[];
  for(const e of E){
    if(e.d!==wd) continue;
    if(e.w && e.w!==par) continue;
    const gg=(e.sub==='lang')?1:2;
    if(e.g && e.g!==gg) continue;
    if(!e.dates.some(r=>day>=r[0]&&day<=r[1])) continue;
    for(const s of e.s) out.push({slot:s,e:e});
  }
  out.sort((a,b)=>a.slot-b.slot);
  return out.map(x=>({e:x.e,from:x.slot,to:x.slot}));
}
/*ENDCORE*/

/* ---------- интерфейс ---------- */
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const WDF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const I={
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
  mon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8M12 16v5"/></svg>'
};
const EMPTY_ICON='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';

const strip=document.getElementById('strip');
const view=document.getElementById('view');
const todayBtn=document.getElementById('todayBtn');

const parts=day=>{const d=new Date(day*864e5);return {y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate(),w:d.getUTCDay()};};
const tm=s=>{const q=s.split(':').map(Number);return q[0]*60+q[1];};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return (m>10&&m<20)?c:k===1?a:(k>=2&&k<=4)?b:c;};

const group=2;
const nowD=new Date();
const TODAY=dayNum(nowD.getFullYear(),nowD.getMonth()+1,nowD.getDate());
let sel=Math.min(Math.max(TODAY,START),END);

function buildStrip(){
  let h='';
  for(let d=START;d<=END;d++){
    const p=parts(d);
    if(p.d===1) h+='<div class="mdiv"><span>'+MS[p.m]+'</span></div>';
    const has=lessonsFor(d,group).length>0;
    h+='<button class="chip'+(p.w===0?' sun':'')+(p.w===1?' mon':'')+(has?' has':'')+(d===TODAY?' today':'')+'" data-d="'+d+'"><i>'+WD[p.w]+'</i><b>'+p.d+'</b><u></u></button>';
  }
  strip.innerHTML=h;
  paintStrip(false);
}
function paintStrip(smooth){
  let el=null;
  strip.querySelectorAll('.chip').forEach(c=>{
    const on=+c.dataset.d===sel;
    c.classList.toggle('sel',on);
    if(on) el=c;
  });
  if(el) strip.scrollTo({left:el.offsetLeft-(strip.clientWidth-el.offsetWidth)/2,behavior:smooth?'smooth':'auto'});
}
function render(anim,dir){
  const p=parts(sel), L=lessonsFor(sel,group);
  const upper=parity(sel)==='u';
  document.getElementById('monthLbl').innerHTML=MN[p.m]+' '+p.y+'<span>'+(upper?'верхняя неделя':'нижняя неделя')+'</span>';
  todayBtn.hidden=(sel===TODAY)||TODAY<START||TODAY>END;

  const total=L.reduce((s,x)=>s+x.to-x.from+1,0);
  const sub=L.length?(total+' '+plural(total,'пара','пары','пар')+' · '+SLOTS[L[0].from][0]+' - '+SLOTS[L[L.length-1].to][1]):'Свободный день';
  let h='<div class="dayhead"><div><h2>'+cap(WDF[p.w])+', '+p.d+' '+MG[p.m]+'</h2><p>'+sub+'</p></div>'+(sel===TODAY?'<span class="tag">Сегодня</span>':'')+'</div>';

  if(!L.length){
    let nx=0;
    for(let d=sel+1;d<=END;d++){if(lessonsFor(d,group).length){nx=d;break;}}
    h+='<div class="empty">'+EMPTY_ICON+'<h3>Занятий нет</h3><p>Можно спокойно отдохнуть</p>';
    if(nx){const q=parts(nx);h+='<button class="gobtn" data-go="'+nx+'">Ближайшие занятия: '+WD[q.w].toLowerCase()+', '+q.d+' '+MG[q.m]+'</button>';}
    h+='</div>';
  } else {
    const nd=new Date(), nm=nd.getHours()*60+nd.getMinutes();
    let firstUp=true, prevEn=null;
    L.forEach(x=>{
      const e=x.e, st=SLOTS[x.from][0], en=SLOTS[x.to][1], n=x.to-x.from+1;
      let brk='';
      if(prevEn){
        const gap=tm(st)-tm(prevEn);
        if(gap>0){
          const dur=gap<60?gap+' мин':(Math.floor(gap/60)+' ч'+(gap%60?' '+(gap%60)+' мин':''));
          brk='<div class="brk"><span>Перерыв '+dur+'</span><em>'+prevEn+' - '+st+'</em></div>';
        }
      }
      prevEn=en;
      let cls='',pill='';
      if(sel===TODAY){
        const a=tm(st),b=tm(en);
        if(nm>=b) cls=' past';
        else if(nm>=a){cls=' now';pill='<span class="pill now">Идёт сейчас</span>';}
        else if(firstUp){firstUp=false;pill='<span class="pill next">Дальше</span>';}
      }
      let place;
      if(e.loc==='rem'){
        place='<div class="meta">'+I.mon+'<span><b>Дистанционно</b></span></div>';
      } else {
        const pl=PLACE[e.loc];
        place='<div class="meta">'+I.pin+'<span><b>Аудитория '+e.room+'</b><br>'+pl.b+' · <a class="addr" href="https://yandex.ru/maps/?text='+encodeURIComponent(pl.a)+'" target="_blank" rel="noopener">'+pl.a+'</a></span></div>';
      }
      h+=brk+'<article class="card '+e.type+cls+'">'+
        '<div class="time"><b>'+st+'</b><span>'+en+'</span></div>'+
        '<div class="body">'+
          '<div class="top2"><span class="badge">'+TYPE[e.type]+'</span>'+(n>1?'<span class="pairs">'+n+' '+plural(n,'пара','пары','пар')+'</span>':'')+pill+'</div>'+
          '<h3>'+SUBJ[e.sub]+'</h3>'+
          '<div class="meta">'+I.user+'<span>'+TEACH[e.t]+'</span></div>'+
          place+
        '</div></article>';
    });
  }
  view.innerHTML=h;
  if(anim){
    view.classList.remove('fade-r','fade-l');
    void view.offsetWidth;
    view.classList.add(dir<0?'fade-l':'fade-r');
  }
}
function go(d){
  d=Math.max(START,Math.min(END,d));
  if(d===sel) return;
  const dir=d>sel?1:-1;
  sel=d;
  paintStrip(true);
  render(true,dir);
}

strip.addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)go(+c.dataset.d);});
view.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(+g.dataset.go);});
todayBtn.addEventListener('click',()=>go(TODAY));
/* свайп по списку занятий */
let tx=0,ty=0;
view.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
view.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) go(sel+(dx<0?1:-1));
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(sel+1);
  if(e.key==='ArrowLeft')go(sel-1);
});

buildStrip();
render(false);
window.addEventListener('load',()=>paintStrip(false));
setInterval(()=>{if(sel===TODAY)render(false);},30000);
</script>
</body>
</html>
